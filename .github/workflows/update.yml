name: Update data & deploy

# Scrapes fresh scratch-off data, commits it, builds the PWA, and deploys to
# GitHub Pages.
#
# NOTE: GitHub only runs `schedule` triggers from the repository's DEFAULT
# branch, so the daily cron activates once this file is merged to main.
# `workflow_dispatch` works from any branch and can be run manually anytime.
#
# One-time setup: repo Settings > Pages > Build and deployment > Source =
# "GitHub Actions".

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC daily (~6–7 AM ET)
  workflow_dispatch:

permissions:
  contents: write # commit refreshed data
  pages: write # deploy Pages
  id-token: write # Pages OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --- Scrape ---
      - name: Install scraper deps
        run: npm ci

      - name: Scrape all fetch-based states
        run: npm run scrape

      # VA is "lite" (list + closing-soon only; no public per-tier data) and
      # needs a headless browser. Non-blocking: a VA failure must not stop the
      # NC deploy.
      - name: Install Chromium (for VA)
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Scrape Virginia (lite)
        run: node scripts/va-scrape.mjs
        continue-on-error: true

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh scratch-off data"
            # Rebase onto anything pushed while we were scraping (manual
            # re-triggers or an overlapping run) so the push can't be rejected.
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && break
              echo "push attempt $i failed; retrying in 5s"
              sleep 5
            done
          fi

      # --- Build PWA ---
      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Build PWA
        run: npm run build
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # --- Deploy ---
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
