name: Pages artifact handoff test

on:
  push:
    branches: [edgedot/pages-artifact-handoff-test]
    paths: [.github/workflows/pages-artifact-handoff-test.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_BASE: /LotteryEdge/
          BUILD_COMMIT: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    steps:
      - name: Find artifact by name on the current run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            count=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name == "github-pages" and (.expired | not))] | length')
            echo "Artifact lookup attempt $attempt: $count"
            if [ "$count" -eq 1 ]; then exit 0; fi
            if [ "$count" -ne 0 ]; then exit 1; fi
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-check
      - name: Verify archive and exact build revision
        shell: bash
        run: |
          set -euo pipefail
          test -s pages-check/artifact.tar
          mkdir pages-dist
          tar -xf pages-check/artifact.tar -C pages-dist
          test -s pages-dist/index.html
          test -s pages-dist/sw.js
          grep -Fq '/LotteryEdge/assets/' pages-dist/index.html
          jq -e --arg sha "$GITHUB_SHA" '.commit == $sha and .workflowCommit == $sha and (.builtAt | type == "string")' pages-dist/build-info.json
          cat pages-dist/build-info.json
