name: Discover VA endpoint (one-time)

# Manually triggered. Captures valottery.com scratcher API responses on the
# open-internet CI runner and commits them to data/va-discovery/ for parser
# development. Safe to delete once the VA scraper is built.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture VA sapi responses
        run: node scripts/va-discovery.mjs
      - name: Commit captures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/va-discovery || true
          if git diff --staged --quiet; then
            echo "Nothing captured."
          else
            git commit -m "chore: VA sapi discovery capture"
            git push
          fi
